[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-ticket-maker"
version = "0.0.1"
description = "GUI app tạo vé loto và xuất PDF"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "reportlab>=4.0",
  "Pillow>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
